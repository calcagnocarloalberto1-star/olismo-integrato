<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f9f5ef"/>
  
  <!-- Gold gradient top bar -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8935a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8c990;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f5ef;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ece4d8;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="200" fill="rgba(184,147,90,0.06)"/>
  <circle cx="1050" cy="500" r="150" fill="rgba(184,147,90,0.04)"/>
  <circle cx="100" cy="450" r="180" fill="rgba(184,147,90,0.05)"/>
  
  <!-- Top gold bar -->
  <rect width="1200" height="6" fill="url(#goldGrad)"/>
  
  <!-- Logo mark -->
  <circle cx="96" cy="96" r="46" fill="none" stroke="#b8935a" stroke-width="2"/>
  <text x="96" y="110" text-anchor="middle" font-size="36" fill="#b8935a" font-family="serif">✦</text>
  
  <!-- Main title -->
  <text x="165" y="80" font-family="Georgia, serif" font-size="48" font-weight="400" fill="#2a2520" letter-spacing="3">OLISMO</text>
  <text x="165" y="118" font-family="Georgia, serif" font-size="48" font-weight="300" fill="#b8935a" letter-spacing="3" font-style="italic">Integrato</text>
  
  <!-- Divider line -->
  <line x1="80" y1="148" x2="600" y2="148" stroke="#b8935a" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="26" font-weight="300" fill="#4a4540" font-style="italic">
    Tutto è connesso nell&#39;essere umano
  </text>
  
  <!-- Description -->
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="18" fill="#7a7268" letter-spacing="0.5">
    Chakra · Enneagramma · Fiori di Bach · Analisi Transazionale
  </text>
  <text x="80" y="283" font-family="Arial, sans-serif" font-size="18" fill="#7a7268" letter-spacing="0.5">
    FES Californiani · Bush Australiani · Frequenze · VAK · Meditazione
  </text>
  
  <!-- Discipline chips -->
  <g transform="translate(80, 320)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(184,147,90,0.12)" stroke="#b8935a" stroke-width="0.8"/>
    <text x="50" y="19" text-anchor="middle" font-family="Arial" font-size="12" fill="#b8935a">◉ Chakra</text>
    <!-- Chip 2 -->
    <rect x="112" y="0" width="116" height="28" rx="14" fill="rgba(184,147,90,0.12)" stroke="#b8935a" stroke-width="0.8"/>
    <text x="170" y="19" text-anchor="middle" font-family="Arial" font-size="12" fill="#b8935a">⬟ Enneagramma</text>
    <!-- Chip 3 -->
    <rect x="240" y="0" width="128" height="28" rx="14" fill="rgba(184,147,90,0.12)" stroke="#b8935a" stroke-width="0.8"/>
    <text x="304" y="19" text-anchor="middle" font-family="Arial" font-size="12" fill="#b8935a">🌸 Fiori di Bach</text>
    <!-- Chip 4 -->
    <rect x="380" y="0" width="86" height="28" rx="14" fill="rgba(184,147,90,0.12)" stroke="#b8935a" stroke-width="0.8"/>
    <text x="423" y="19" text-anchor="middle" font-family="Arial" font-size="12" fill="#b8935a">⚙ AT/VAK</text>
    <!-- Chip 5 -->
    <rect x="478" y="0" width="110" height="28" rx="14" fill="rgba(184,147,90,0.12)" stroke="#b8935a" stroke-width="0.8"/>
    <text x="533" y="19" text-anchor="middle" font-family="Arial" font-size="12" fill="#b8935a">✦ Consulente AI</text>
  </g>
  
  <!-- Author box -->
  <rect x="80" y="400" width="520" height="72" rx="10" fill="white" opacity="0.7"/>
  <line x1="80" y1="400" x2="80" y2="472" stroke="#b8935a" stroke-width="3"/>
  <text x="100" y="424" font-family="Georgia, serif" font-size="18" fill="#2a2520" font-weight="400">Carlo Alberto Calcagno</text>
  <text x="100" y="448" font-family="Arial" font-size="13" fill="#7a7268">Mediatore Familiare · Formatore · Inventore Enneagramma Evolutivo</text>
  <text x="100" y="466" font-family="Arial" font-size="13" fill="#b8935a">olismo-integrato.it</text>
  
  <!-- Right side: big decorative ✦ -->
  <text x="950" y="420" text-anchor="middle" font-size="260" fill="rgba(184,147,90,0.08)" font-family="serif">✦</text>
  
  <!-- Bottom bar -->
  <rect y="624" width="1200" height="6" fill="url(#goldGrad)"/>
  
  <!-- URL -->
  <text x="600" y="612" text-anchor="middle" font-family="Arial" font-size="14" fill="#a09488" letter-spacing="2">
    olismo-integrato.it
  </text>
</svg>